<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Peta Titik Indonesia – Live Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
/* Penyesuaian: Memastikan container memenuhi layar dengan benar */
html, body { margin:0; padding:0; height: 100%; width: 100%; overflow: hidden; }
#map { width:100%; height:100vh; background: #f0f0f0; }

/* Panel tombol */
.panel{
  position:absolute;
  top:10px;
  right:10px;
  z-index:1000;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.panel button{
  background:#ffffff;
  border:1px solid #ccc;
  border-radius:6px;
  padding:10px 12px;
  font-size:13px;
  font-weight: bold;
  cursor:pointer;
  box-shadow:0 2px 4px rgba(0,0,0,.2);
  /* Penyesuaian: Mencegah delay klik di layar sentuh */
  touch-action: manipulation;
}

/* Legenda */
.legend{
  position:absolute;
  bottom:25px;
  left:10px;
  background:rgba(255,255,255,0.9);
  padding:8px 12px;
  font-size:13px;
  z-index:1000;
  border-radius:6px;
  box-shadow:0 0 5px rgba(0,0,0,.3);
  pointer-events: none;
}

/* Live position biru berdenyut */
.pulse-blue{
  width:16px;
  height:16px;
  background:rgba(0,123,255,1);
  border: 2px solid white; 
  border-radius:50%;
  position:relative;
  box-shadow: 0 0 5px rgba(0,0,0,0.3);
}
.pulse-blue::after{
  content:"";
  position:absolute;
  left:-2px;
  top:-2px;
  width:16px;
  height:16px;
  border-radius:50%;
  background:transparent;
  border: 2px solid rgba(0,123,255,0.8);
  animation:pulse 1.5s ease-out infinite;
}
@keyframes pulse{
  0%{transform:scale(1);opacity:1;}
  100%{transform:scale(3);opacity:0;}
}
</style>
</head>

<body>

<div id="map"></div>

<div class="panel">
  <button onclick="goToMe()">🧭 Ke posisi saya</button>
  <button id="btnFollow" onclick="toggleFollow()">📍 Ikuti: OFF</button>
  <button onclick="resetZoom()">🔄 Reset zoom</button>
</div>

<div class="legend">
🔴 Titik koordinat (Data Anda)<br>
🔵 Posisi Anda (LIVE)
</div>

<script>
// ============================
// INIT MAP
// ============================
// Penyesuaian: Mematikan kontrol zoom default untuk dipindah ke kanan bawah agar tidak tertutup panel
var map = L.map('map', { zoomControl: false });
L.control.zoom({ position: 'bottomright' }).addTo(map);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; OpenStreetMap'
}).addTo(map);

// ============================
// KOORDINAT ANDA (Substansi Tetap)
// ============================
var coords = [
  [-0.9398683,113.9983633], [-0.9396475,113.997305], [-0.9396131,113.9963251],
  [-0.9400508,113.9958913], [-0.9426341,113.9922969], [-0.9443269,113.989899],

  [-0.99640991,113.96037519], [-0.998942,113.9586848], [-1.0019681,113.9573841],
  [-1.0049293,113.9578595], [-1.0062289,113.9576941], [-1.0068049,113.9576488],
  [-1.0119795,113.9556548], [-1.0210327,113.9521815], [-1.0221569,113.9501734],

  [-1.0814819,113.8878399], [-1.0816308,113.8869932], [-1.0820327,113.8851276],

  [-1.083747,113.8801259], [-1.0842773,113.8790922], [-1.086053,113.8771372],

  [-1.0895748,113.8705911], [-1.0913175,113.8691019], [-1.0919588,113.868948]
];

// ============================
// RENDER DATA MARKERS
// ============================
var bounds=[];
coords.forEach(function(c){
  bounds.push(c);
  L.circleMarker(c,{
    radius:4, /* Sedikit lebih besar agar mudah dilihat di layar HP */
    fillColor:'red',
    color:'white', /* Border putih agar titik merah tidak tersamar dengan jalan */
    weight:1,
    fillOpacity:0.6
  }).addTo(map);
});

var initialBounds = bounds.length ? L.latLngBounds(bounds) : null;
if(initialBounds){ map.fitBounds(initialBounds); }

// ============================
// LIVE POSITION (BIRU - Optimasi Android)
// ============================
var lastUserLatLng = null;
var liveMarker = null;
var followMode = false;

var blueIcon = L.divIcon({
  className:'',
  html:'<div class="pulse-blue"></div>',
  iconSize:[16,16],
  iconAnchor:[8,8]
});

// Penyesuaian: Memisahkan fungsi update lokasi agar lebih stabil di Chrome
function onLocationUpdate(pos) {
    lastUserLatLng = [pos.coords.latitude, pos.coords.longitude];
    if(!liveMarker) {
        liveMarker = L.marker(lastUserLatLng,{icon:blueIcon}).addTo(map).bindPopup("📍 Posisi Anda");
    } else {
        liveMarker.setLatLng(lastUserLatLng);
    }
    
    if(followMode){
        map.panTo(lastUserLatLng);
    }
}

if(navigator.geolocation){
  navigator.geolocation.watchPosition(onLocationUpdate, 
    function(err){
      console.warn("GPS Error: " + err.message);
    },
    {
      enableHighAccuracy: true,
      timeout: 10000, 
      maximumAge: 0
    }
  );
}

// ============================
// BUTTON FUNCTIONS
// ============================
function goToMe(){
  if(lastUserLatLng){
    map.setView(lastUserLatLng, 17); // Zoom lebih dekat saat fokus ke saya
  } else {
    alert("Sedang mencari sinyal GPS...");
  }
}

function toggleFollow(){
  followMode = !followMode;
  var btn = document.getElementById('btnFollow');
  btn.innerText = followMode ? "📍 Ikuti: ON" : "📍 Ikuti: OFF";
  // Memberikan feedback warna agar user tahu mode aktif
  btn.style.background = followMode ? "#e3f2fd" : "#ffffff";
}

function resetZoom(){
  if(initialBounds){
    map.fitBounds(initialBounds);
  }
}

// Penyesuaian Penting: Menjamin peta dirender ulang agar tidak abu-abu di Android
window.addEventListener('load', function() {
    setTimeout(function() { 
        map.invalidateSize(); 
    }, 500);
});
</script>

</body>
</html>
