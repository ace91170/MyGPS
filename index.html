.panel{
  position:absolute; top:10px; right:10px; z-index:1000;
  display:flex; flex-direction:column; gap:8px;
}
.panel button{
  background:#ffffff; border:1px solid #ccc; border-radius:6px;
  padding:12px 14px; font-size:13px; font-weight: bold;
  cursor:pointer; box-shadow:0 2px 4px rgba(0,0,0,.2);
  touch-action: manipulation;
}

.legend{
  position:absolute; bottom:95px; left:10px;
  background:rgba(255,255,255,0.9); padding:8px 12px;
  font-size:12px; z-index:1000; border-radius:6px;
  box-shadow:0 0 5px rgba(0,0,0,0.3); pointer-events: none;
}

.leaflet-bottom.leaflet-right {
    bottom: 90px !important;
    margin-right: 10px;
}

.pulse-blue{
  width:16px; height:16px; background:rgba(0,123,255,1);
  border: 2px solid white; border-radius:50%;
  position:relative; box-shadow: 0 0 5px rgba(0,0,0,0.3);
}
.pulse-blue::after{
  content:""; position:absolute; left:-2px; top:-2px;
  width:16px; height:16px; border-radius:50%;
  background:transparent; border: 2px solid rgba(0,123,255,0.8);
  animation:pulse 1.5s ease-out infinite;
}
@keyframes pulse{
  0%{transform:scale(1);opacity:1;}
  100%{transform:scale(3);opacity:0;}
}

var bounds=[];
coords.forEach(function(c){
  bounds.push(c);
  L.circleMarker(c,{
    radius:4, fillColor:'red', color:'white', weight:1, fillOpacity:0.6
  }).addTo(map);
});

var initialBounds = bounds.length ? L.latLngBounds(bounds) : null;
if(initialBounds){ map.fitBounds(initialBounds); }

var lastUserLatLng = null;
var liveMarker = null;
var followMode = false;

var blueIcon = L.divIcon({
  className:'',
  html:'<div class="pulse-blue"></div>',
  iconSize:[16,16], iconAnchor:[8,8]
});

function onLocationUpdate(pos) {
    lastUserLatLng = [pos.coords.latitude, pos.coords.longitude];
    if(!liveMarker) {
        liveMarker = L.marker(lastUserLatLng,{icon:blueIcon}).addTo(map).bindPopup("📍 Posisi Anda");
    } else {
        liveMarker.setLatLng(lastUserLatLng);
    }
    if(followMode){ map.panTo(lastUserLatLng); }
}

if(navigator.geolocation){
  navigator.geolocation.watchPosition(onLocationUpdate, 
    function(err){ console.warn("GPS: " + err.message); },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

function goToMe(){
  if(lastUserLatLng){ map.setView(lastUserLatLng, 17); }
  else { alert("Sinyal GPS belum ditemukan..."); }
}

function toggleFollow(){
  followMode = !followMode;
  var btn = document.getElementById('btnFollow');
  btn.innerText = followMode ? "📍 Ikuti: ON" : "📍 Ikuti: OFF";
  btn.style.background = followMode ? "#e3f2fd" : "#ffffff";
}

function resetZoom(){
  if(initialBounds){ map.fitBounds(initialBounds); }
}

window.addEventListener('load', function() {
    setTimeout(function() { map.invalidateSize(); }, 600);
});
